name: Pruebas

# Lo que tiene que seguir funcionando antes de publicar cualquier versión.
# Lo usan «Compilar APK» (en cada cambio) y se puede correr a mano desde la pestaña Actions.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interfaz:
    name: Interfaz y motor de mezcla
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preparar navegador de pruebas
        run: |
          pip install -r pruebas/requisitos.txt
          python -m playwright install --with-deps chromium

      - name: Probar
        run: python -m pytest pruebas -v

  youtube:
    name: YouTube (búsqueda y descarga reales)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Probar YouTube
        run: gradle testReleaseUnitTest --no-daemon

      - name: Resultado
        if: always()
        run: |
          R=$(cat youtube-check.txt 2>/dev/null || echo "sin resultado (la prueba no llegó a correr)")
          echo "YouTube: $R"
          case "$R" in
            ok) echo "::notice::YouTube funciona: búsqueda y descarga de audio correctas"
                echo "### ✅ YouTube funciona: búsqueda y descarga de audio correctas" >> "$GITHUB_STEP_SUMMARY" ;;
            bloqueado*) echo "::warning::YouTube pidió verificación al servidor de GitHub; no se pudo comprobar. $R"
                        echo "### ⚠️ YouTube no dejó comprobar desde GitHub (no indica que la app falle)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::YouTube: $R"
               echo "### ❌ YouTube: $R" >> "$GITHUB_STEP_SUMMARY"
               exit 1 ;;
          esac
