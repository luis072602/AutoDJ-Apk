name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # La firma se crea una sola vez y se guarda en el repositorio, para que todas las
      # versiones salgan firmadas igual y el teléfono las acepte como actualización.
      - name: Firma fija
        run: |
          if [ ! -f app/autodj.keystore ]; then
            keytool -genkeypair -keystore app/autodj.keystore -storepass autodj-apk -keypass autodj-apk \
              -alias autodj -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AutoDJ"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/autodj.keystore
            git commit -m "Firma fija de la app"
            git push
          fi

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoDJ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoDJ-apk
          path: AutoDJ.apk

      # Enlace fijo de descarga: …/releases/latest/download/AutoDJ.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: AutoDJ 0.1.${{ github.run_number }}
          body: Instala AutoDJ.apk en tu Android. Se actualiza sola encima de la versión anterior.
          files: AutoDJ.apk
          make_latest: 'true'
