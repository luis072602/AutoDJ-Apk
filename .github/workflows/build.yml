name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # La firma se crea una sola vez y se guarda en el repositorio, para que todas las
      # versiones salgan firmadas igual y el teléfono las acepte como actualización.
      - name: Firma fija
        run: |
          if [ ! -f app/autodj.keystore ]; then
            keytool -genkeypair -keystore app/autodj.keystore -storepass autodj-apk -keypass autodj-apk \
              -alias autodj -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AutoDJ"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/autodj.keystore
            git commit -m "Firma fija de la app"
            git push
          fi

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk AutoDJ.apk
          echo "0.1.${{ github.run_number }}" > version.txt   # la app lo lee para saber si hay actualización

      # Comprueba que el APK esté bien firmado y no sea de depuración antes de publicarlo
      - name: Verificar APK
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose --print-certs AutoDJ.apk | head -12
          "$TOOLS/aapt" dump badging AutoDJ.apk | grep -E "^package|sdkVersion|targetSdkVersion|application-debuggable" || true
          if "$TOOLS/aapt" dump badging AutoDJ.apk | grep -q "application-debuggable"; then echo "El APK es de depuración"; exit 1; fi
          sha256sum AutoDJ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AutoDJ-apk
          path: AutoDJ.apk

      # Cada versión es una publicación propia y completa (el APK nunca se reemplaza a medias).
      # Enlace fijo a la más reciente: …/releases/latest/download/AutoDJ.apk
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" AutoDJ.apk version.txt \
            --title "AutoDJ 0.1.${{ github.run_number }}" \
            --notes "Instala AutoDJ.apk en tu Android. Se actualiza encima de la versión anterior." \
            --latest
